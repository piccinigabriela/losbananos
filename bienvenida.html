<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenida</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --coral:#FF6F59; --menta:#AEBF92; --carbon:#201E1D; --cream:#FBF7F0; }
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--carbon);margin:0}
  header{padding:28px 20px 16px;text-align:center}
  header h1{margin:0;font-size:1.5rem}
  nav{display:flex;overflow-x:auto;gap:6px;padding:0 12px 12px;border-bottom:1px solid #e5ddd0}
  nav button{flex:0 0 auto;background:none;border:none;padding:8px 14px;border-radius:20px;font-size:.85rem;font-weight:600;color:#777;cursor:pointer}
  nav button.activo{background:var(--coral);color:#fff}
  main{padding:20px;max-width:600px;margin:0 auto}
  section{display:none}
  section.activa{display:block}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card h3{margin:0 0 6px;font-size:1rem}
  .card a{color:var(--coral);text-decoration:none;font-size:.85rem;font-weight:600}
  .advertencia{margin-top:8px;background:#fff3e0;color:#8a5a00;padding:8px 10px;border-radius:8px;font-size:.82rem;border-left:3px solid #e0a300}
  .precio{display:inline-block;background:var(--menta);color:#2f3d1f;padding:2px 10px;border-radius:12px;font-size:.8rem;font-weight:700;margin-top:6px}
  .wifi-box{background:var(--carbon);color:#fff;border-radius:12px;padding:16px;text-align:center}
  .wifi-box .clave{font-family:monospace;font-size:1.2rem;letter-spacing:1px}
</style>
</head>
<body>

<header>
  <h1 id="titulo">Bienvenida</h1>
</header>

<nav id="tabs"></nav>

<main>
  <section id="tab-llegar" class="activa">
    <div class="card">
      <h3>Dirección</h3>
      <p id="direccion-texto"></p>
    </div>
    <div class="card">
      <h3>En auto</h3>
      <p id="auto-texto"></p>
    </div>
    <div class="card">
      <h3>Bus público</h3>
      <span class="precio" id="bus-precio-texto"></span>
      <p id="bus-detalle-texto"></p>
    </div>
    <div class="card">
      <h3>Uber / remis</h3>
      <p id="uber-texto"></p>
    </div>
  </section>

  <section id="tab-ver">
    <div id="atracciones-cards"></div>
  </section>

  <section id="tab-comer">
    <div id="comer-cards"></div>
  </section>

  <section id="tab-servicios">
    <div class="card" id="wifi-card" style="display:none">
      <div class="wifi-box">
        <div>Red</div>
        <div class="clave" id="wifi-red-texto"></div>
        <div style="margin-top:8px">Clave</div>
        <div class="clave" id="wifi-clave-texto"></div>
      </div>
    </div>
    <div class="card" id="servicios-card">
      <h3>Servicios</h3>
      <ul id="servicios-lista"></ul>
    </div>
  </section>
</main>

<script>
// ---- CONFIG: completar con los datos reales del proyecto ----
const SUPABASE_URL = "https://vnfgitgadadjjjciftsa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IKbP0ieyJfrtdguY39N7wg_RMjN_CxH";
const CUENTA_SLUG = "wood-cabin"; // cambiar según el cliente al reusar este archivo
// ---------------------------------------------------------------

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tabs = [
  { id: 'tab-llegar', label: 'Cómo llegar' },
  { id: 'tab-ver', label: 'Qué ver' },
  { id: 'tab-comer', label: 'Dónde comer' },
  { id: 'tab-servicios', label: 'Servicios' }
];

function armarTabs(){
  const nav = document.getElementById('tabs');
  tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.className = i === 0 ? 'activo' : '';
    btn.onclick = () => mostrarTab(t.id, btn);
    nav.appendChild(btn);
  });
}

function mostrarTab(id, btnClickeado){
  document.querySelectorAll('section').forEach(s => s.classList.remove('activa'));
  document.getElementById(id).classList.add('activa');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('activo'));
  btnClickeado.classList.add('activo');
}

function linkMaps(lat, lng){
  return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
}

function pintar(data){
  document.getElementById('titulo').textContent = 'Bienvenido a ' + data.nombre_cliente;
  const c = data.contenido || {};

  document.getElementById('direccion-texto').textContent = c.direccion || '—';
  document.getElementById('auto-texto').textContent = (c.como_llegar && c.como_llegar.auto) || '—';

  const bus = (c.como_llegar && c.como_llegar.bus_publico) || {};
  document.getElementById('bus-precio-texto').textContent = bus.precio ? `$${bus.precio.toLocaleString('es-AR')}` : '—';
  document.getElementById('bus-detalle-texto').textContent = bus.detalle || '';

  document.getElementById('uber-texto').textContent = (c.como_llegar && c.como_llegar.uber_remis) || '—';

  const atraccionesBox = document.getElementById('atracciones-cards');
  atraccionesBox.innerHTML = '';
  (c.atracciones || []).forEach(a => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3>${a.nombre}</h3>
      ${a.lat && a.lng ? `<a href="${linkMaps(a.lat,a.lng)}" target="_blank">Ver en Google Maps →</a>` : ''}
      ${a.advertencia ? `<div class="advertencia">⚠️ ${a.advertencia}</div>` : ''}
    `;
    atraccionesBox.appendChild(div);
  });

  const comerBox = document.getElementById('comer-cards');
  comerBox.innerHTML = '';
  (c.donde_comer || []).forEach(r => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3>${r.nombre}</h3>
      ${r.nota ? `<p>${r.nota}</p>` : ''}
      ${r.lat && r.lng ? `<a href="${linkMaps(r.lat,r.lng)}" target="_blank">Ver en Google Maps →</a>` : ''}
    `;
    comerBox.appendChild(div);
  });

  const wifi = c.wifi || {};
  if(wifi.activo){
    document.getElementById('wifi-card').style.display = 'block';
    document.getElementById('wifi-red-texto').textContent = wifi.red || '—';
    document.getElementById('wifi-clave-texto').textContent = wifi.clave || '—';
  }

  const serviciosLista = document.getElementById('servicios-lista');
  serviciosLista.innerHTML = '';
  (c.servicios || []).forEach(s => {
    const li = document.createElement('li');
    li.textContent = s;
    serviciosLista.appendChild(li);
  });
}

async function cargar(){
  armarTabs();
  const { data, error } = await sb
    .from('guias_bienvenida')
    .select('*')
    .eq('cuenta_slug', CUENTA_SLUG)
    .maybeSingle();

  if(error || !data){
    document.getElementById('titulo').textContent = 'No se pudo cargar la guía';
    return;
  }
  pintar(data);
}

cargar();
</script>
</body>
</html>
